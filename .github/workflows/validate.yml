name: Validate Santa template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-shell:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse endpoint evidence script
        shell: /bin/zsh -e {0}
        run: |
          /bin/zsh -n ./scripts/Test-SantaEndpoint.sh
          /bin/bash -n ./scripts/live-response/Get-SantaHealth.sh
          /bin/bash ./tests/Test-SantaHealth.sh
          /bin/bash -n ./scripts/live-response/Get-SantaRuleReceipt.sh
          /bin/bash ./tests/Test-SantaRuleReceipt.sh
          /bin/bash -n ./scripts/live-response/Get-SantaProfileState.sh
          /bin/bash ./tests/Test-SantaProfileState.sh
          /bin/bash -n ./experiments/server/bootstrap-host.sh
          /bin/bash -n ./experiments/server/diagnose-host.sh
          /bin/bash -n ./experiments/server/inspect-build.sh
          /bin/bash -n ./experiments/server/rebuild-core.sh
          /bin/bash -n ./experiments/server/resume-runtime.sh
          /bin/bash -n ./experiments/server/build-core-variant.sh

      - name: Build and check the native execution fixture
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/santa-native-fixture.XXXXXXXX")"
          xcrun clang -arch arm64 -arch x86_64 -Os -Wall -Wextra -Werror \
            tests/fixtures/endpoint/santa-pilot-executable.c -o "$stage/santa-pilot-executable"
          codesign --force --sign - "$stage/santa-pilot-executable"
          codesign --verify --strict --all-architectures "$stage/santa-pilot-executable"
          lipo "$stage/santa-pilot-executable" -verify_arch arm64 x86_64
          [[ "$("$stage/santa-pilot-executable")" == 'santa-pilot-execution-fixture-ok' ]]
          git rev-parse HEAD > "$stage/source-commit.txt"
          (
            cd "$stage"
            shasum -a 256 santa-pilot-executable | tee SHA256SUMS
          )
          COPYFILE_DISABLE=1 tar -C "$stage" -cf "$RUNNER_TEMP/santa-native-execution-fixture.tar" \
            santa-pilot-executable source-commit.txt SHA256SUMS

      - name: Retain the reviewed native execution fixture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: santa-native-execution-fixture
          path: ${{ runner.temp }}/santa-native-execution-fixture.tar
          if-no-files-found: error
          retention-days: 7

  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select PowerShell 7.6.6
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = 'Windows' ]; then
            runtime="$(cygpath -u "$RUNNER_TEMP")/powershell-7.6.6"
            archive="$runtime.zip"
            mkdir "$runtime"
            curl --fail --location --output "$archive" 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip'
            echo "02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860  $archive" | sha256sum --check
            python -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$archive" "$runtime"
            cygpath -w "$runtime" >> "$GITHUB_PATH"
          else
            runtime="$RUNNER_TEMP/powershell-7.6.6"
            archive="$runtime.tar.gz"
            mkdir "$runtime"
            curl --fail --location --output "$archive" 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz'
            echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  $archive" | sha256sum --check
            tar -xzf "$archive" -C "$runtime"
            chmod +x "$runtime/pwsh"
            echo "$runtime" >> "$GITHUB_PATH"
          fi

      - name: Test profile inventory on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./tests/Test-SantaProfileState.sh

      - name: Assert selected PowerShell runtime
        run: |
          if ($PSVersionTable.PSVersion -ne [version]'7.6.6' -or -not [Environment]::Is64BitProcess) {
            throw "Expected 64-bit PowerShell 7.6.6; observed $($PSVersionTable.PSVersion)."
          }
          $PSVersionTable.PSVersion
      - name: Install test runner
        run: Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser
      - name: Install crypto test dependency already used by the pinned server
        run: |
          python -m pip install --only-binary=:all: cryptography==50.0.0

      - name: Verify an exact retained Docker image before loading
        if: runner.os == 'Linux'
        shell: bash
        run: timeout 90s bash tests/test_retained_image_docker.sh

      - name: Verify local Santa health evidence during sync timeout
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/Test-SantaHealth.sh

      - name: Verify native rule receipt diagnostics against shell fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/Test-SantaRuleReceipt.sh

      - name: Generate and validate offline artifacts
        run: |
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          Get-Module Pester | Select-Object Name, Version, Path
          ./scripts/New-DeploymentPlan.ps1 -Organization 'Contoso'
          ./scripts/Test-SantaTemplate.ps1
          Invoke-Pester ./tests -CI

      - name: Confirm committed generated profiles are reproducible
        run: git diff --exit-code -- profiles/generated

      - name: Verify sealed backend fixture recovery
        if: runner.os == 'Linux'
        shell: bash
        run: timeout 420s bash tests/test_restore_census_postgres.sh
