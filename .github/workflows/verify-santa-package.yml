name: Verify Santa package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select PowerShell 7.6.6
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/powershell-7.6.6"
          archive="$runtime.tar.gz"
          case "$(uname -m)" in
            x86_64)
              architecture='x64'
              sha256='e325ed9f666894eb39a5ea52800b602da2fb4242bbe9747ceddb39cdc66de805'
              ;;
            arm64)
              architecture='arm64'
              sha256='6df833d094ebac1c1a74340d7b3437f4aaf5e03ce640484a1c4359f3ce8b3db1'
              ;;
            *) echo 'Unsupported macOS architecture' >&2; exit 1 ;;
          esac
          mkdir "$runtime"
          curl --fail --location --output "$archive" "https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-osx-$architecture.tar.gz"
          echo "$sha256  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$runtime"
          chmod +x "$runtime/pwsh"
          echo "$runtime" >> "$GITHUB_PATH"

      - name: Assert selected PowerShell runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -ne [version]'7.6.6' -or -not [Environment]::Is64BitProcess) {
            throw "Expected 64-bit PowerShell 7.6.6; observed $($PSVersionTable.PSVersion)."
          }
          $PSVersionTable.PSVersion

      - name: Verify immutable package
        shell: pwsh
        run: |
          ./scripts/Get-SantaPackage.ps1 -Destination ./out/santa-2026.8.pkg -ReceiptPath ./out/package-verification-receipt.json

      - name: Upload verified package, receipt, and licenses
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: santa-2026.8-verified
          path: |
            out/santa-2026.8.pkg
            out/package-verification-receipt.json
            third_party/santa-2026.8/LICENSE.txt
            third_party/santa-2026.8/ThirdPartyLicenses.txt
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 3
